<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:627px;overflow:hidden;background:#0b1026}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,Arial,sans-serif;
background:linear-gradient(135deg,#0b1026 0%,#1b1f4a 55%,#3a1f5c 100%);color:#fff;position:relative}
.star{position:absolute;background:#fff;border-radius:50%}
.moon{position:absolute;right:90px;top:70px;width:96px;height:96px;border-radius:50%;box-shadow:-26px 14px 0 0 #fde68a;transform:rotate(-15deg)}
.left{position:absolute;left:80px;top:90px;width:680px}
h1{font-size:96px;font-weight:800;letter-spacing:-3px;margin:0 0 18px}
.tag{font-size:32px;font-weight:600;color:#c7cbff;line-height:1.3;margin:0}
.chips{display:flex;gap:12px;margin-top:34px;flex-wrap:nowrap}
.chip{white-space:nowrap;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font-size:20px;font-weight:600}
.url{position:absolute;left:80px;bottom:52px;font-size:24px;color:#a5b4fc;font-weight:600;font-family:"SF Mono",Menlo,monospace}
.glow{position:absolute;right:20px;top:250px;width:520px;height:300px;background:radial-gradient(ellipse at center,rgba(124,131,255,.5),rgba(124,131,255,0) 70%)}
.laptop{position:absolute;right:70px;top:360px;width:320px}
.lid{height:52px;border-radius:12px;background:linear-gradient(#e5e8ef,#9aa2b3);margin:0 12px;position:relative}
.lid:after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;opacity:.7}
.base{height:18px;border-radius:9px;background:#6b7385;margin-top:-4px}
.running{position:absolute;right:105px;top:300px;font-size:26px;font-weight:800;color:#a5f3fc}
.phone{position:absolute;right:120px;top:120px;width:300px;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.95);color:#0f172a;font-size:19px;line-height:1.35;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.phone b{color:#7c3aed}
.batt{position:absolute;right:180px;top:460px;width:100px;height:44px;border:3px solid #e5e7eb;border-radius:10px;box-sizing:border-box}
.batt:after{content:"";position:absolute;right:-10px;top:12px;width:6px;height:14px;background:#e5e7eb;border-radius:2px}
.batt i{position:absolute;left:4px;top:4px;bottom:4px;width:64%;border-radius:5px;background:linear-gradient(90deg,#34d399,#10b981)}
.batt span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style></head><body>
<div class="star" style="left:60px;top:50px;width:3px;height:3px;opacity:.8"></div>
<div class="star" style="left:420px;top:60px;width:2px;height:2px;opacity:.6"></div>
<div class="star" style="left:700px;top:40px;width:3px;height:3px;opacity:.7"></div>
<div class="star" style="left:760px;top:560px;width:2px;height:2px;opacity:.5"></div>
<div class="star" style="left:1150px;top:300px;width:3px;height:3px;opacity:.7"></div>
<div class="left">
  <h1>lidguard</h1>
  <p class="tag">Close the lid. Keep your agents running.<br>Never come back to a dead battery.</p>
  <div class="chips"><div class="chip">⏱ sleeps after 4 h</div><div class="chip">🔋 stops under 20%</div><div class="chip">🎒 backpack-safe</div></div>
</div>
<div class="phone">🎒 <b>you:</b> how's the deploy ETA?<br>🤖 <b>Claude Code:</b> backup 62%, deploy ~10:10 ✓</div>
<div class="glow"></div>
<div class="running">still running…</div>
<div class="laptop"><div class="lid"></div><div class="base"></div></div>
<div class="batt"><i></i><span>73%</span></div><div class="url">github.com/agudeluca/lidguard</div>
</body></html>
